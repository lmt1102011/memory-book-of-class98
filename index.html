<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="A cinematic school memory photobook and Korean photobooth web app for graduation memories."
    />
    <meta name="theme-color" content="#fbf3e7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Memory98" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" sizes="512x512" href="./logo-web-class-98.png?v=20260522-pwa4" />
    <link rel="icon" type="image/png" sizes="192x192" href="./logo-web-class-98-192.png?v=20260522-pwa4" />
    <link rel="apple-touch-icon" href="./logo-web-class-98-192.png?v=20260522-pwa4" />
    <link rel="manifest" href="./manifest.webmanifest?v=20260522-pwa4" />
    <script>
      (() => {
        const navigatorWithStandalone = window.navigator;
        const displayModes = ['standalone', 'fullscreen', 'minimal-ui', 'window-controls-overlay'];
        const isInstalledApp =
          displayModes.some((mode) => window.matchMedia(`(display-mode: ${mode})`).matches) ||
          navigatorWithStandalone.standalone === true;

        if (isInstalledApp) {
          document.documentElement.classList.add('memory98-standalone');
        }

        var recoveryKey = 'memory98-early-asset-reload-at';
        var recoveryCooldown = 20000;
        var isRecovering = false;

        var reloadFresh = function () {
          var url = new URL(window.location.href);
          url.searchParams.set('assetRefresh', Date.now().toString(36));
          window.location.replace(url.toString());
        };

        var clearAppCaches = function () {
          if (!('caches' in window)) return Promise.resolve();

          return caches.keys().then(function (names) {
            return Promise.allSettled(
              names
                .filter(function (name) {
                  return name.indexOf('memory98-app-shell') === 0;
                })
                .map(function (name) {
                  return caches.delete(name);
                }),
            );
          });
        };

        var recoverFromMissingAsset = function () {
          if (isRecovering) return;

          var lastReload = Number(sessionStorage.getItem(recoveryKey) || 0);
          var now = Date.now();
          if (now - lastReload < recoveryCooldown) return;

          isRecovering = true;
          sessionStorage.setItem(recoveryKey, String(now));

          Promise.race([
            Promise.allSettled([
              clearAppCaches(),
              'serviceWorker' in navigator
                ? navigator.serviceWorker.getRegistration().then(function (registration) {
                    return registration && registration.update();
                  }).catch(function () {})
                : Promise.resolve(),
            ]),
            new Promise(function (resolve) {
              setTimeout(resolve, 1500);
            }),
          ]).finally(reloadFresh);
        };

        var isMissingAssetTarget = function (target) {
          var url = '';
          if (target && target.tagName === 'SCRIPT') url = target.src || '';
          if (target && target.tagName === 'LINK') url = target.href || '';
          url = String(url).toLowerCase();
          return url.indexOf('/assets/') !== -1 && (url.indexOf('.js') !== -1 || url.indexOf('.css') !== -1);
        };

        window.addEventListener(
          'error',
          function (event) {
            if (isMissingAssetTarget(event.target)) recoverFromMissingAsset();
          },
          true,
        );

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'MEMORY98_ASSET_MISSING') recoverFromMissingAsset();
          });
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        background: #fbf3e7;
      }

      body {
        margin: 0;
      }

      .memory98-boot {
        min-height: 100svh;
        display: none;
        place-items: center;
        padding: 24px;
        color: #4f3428;
        font-family: Poppins, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }

      html.memory98-standalone .memory98-boot {
        display: grid;
        opacity: 0;
        animation: memory98-boot-show 0.18s ease 0.45s forwards;
      }

      .memory98-boot-card {
        width: min(340px, 100%);
        padding: 24px 20px 20px;
        border: 1px solid rgba(79, 52, 40, 0.12);
        border-radius: 24px;
        background: rgba(255, 252, 246, 0.96);
        box-shadow: 0 20px 54px rgba(79, 52, 40, 0.13);
      }

      .memory98-boot img {
        width: 88px;
        height: 88px;
        object-fit: contain;
        border-radius: 26px;
        background: #fff7ee;
        box-shadow: 0 10px 24px rgba(79, 52, 40, 0.13);
      }

      .memory98-boot strong {
        display: block;
        margin-top: 16px;
        font-size: 19px;
        line-height: 1.35;
      }

      .memory98-boot span {
        display: block;
        margin-top: 5px;
        color: rgba(79, 52, 40, 0.68);
        font-size: 13px;
        line-height: 1.55;
      }

      .memory98-boot-bar {
        height: 7px;
        margin-top: 16px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(79, 52, 40, 0.12);
      }

      .memory98-boot-bar i {
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #f4a7b9, #8bbde8, #d7a979);
        animation: memory98-boot-progress 1.05s ease-in-out infinite;
        transform: translate3d(-110%, 0, 0);
      }

      @keyframes memory98-boot-show {
        to {
          opacity: 1;
        }
      }

      @keyframes memory98-boot-progress {
        to {
          transform: translate3d(230%, 0, 0);
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Poppins:wght@400;500;600;700;800&family=Saira+Condensed:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>School Memory Photobook</title>
  </head>
  <body>
    <div id="root">
      <div class="memory98-boot" role="status" aria-live="polite">
        <div class="memory98-boot-card">
          <img src="./logo-web-class-98.png" alt="Memory98" />
          <strong>Đang mở Memory98...</strong>
          <span>Đang chuẩn bị không gian ký ức của lớp 9/8.</span>
          <div class="memory98-boot-bar"><i></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
